# https://taskfile.dev/styleguide/
# Avoid chaining commands with ; or && in a single line. Use multiple cmd items for independent steps, or write a script under scripts/ instead.

version: '3'

tasks:
  default:
    deps:
      - task: fmt
      - task: check

  check:
    deps:
      - task: lint
    cmds:
      - renovate-config-validator --strict --no-global default.json .github/renovate.jsonc
      - npm test

  fmt:
    cmds:
      - dprint fmt

  lint:
    cmds:
      - dprint check
      - oxlint -c .oxlintrc.json --deny-warnings
      - typos . .github
